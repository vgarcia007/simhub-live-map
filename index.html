<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FM8 Live Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>

    .car-icon {
      width: 32px;
      height: 32px;
      background-image: url('https://cdn-icons-png.flaticon.com/512/744/744465.png'); /* Beispielicon */
      background-size: cover;
      transform-origin: center center;
    }

#map-wrapper {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* Container wird größer, um die Rotation aufzufangen */
#map-container {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 300vw;  /* größer als Bildschirm */
  height: 300vh;
  transform-origin: center center;
  transition: transform 0.2s linear;
}

/* Die Leaflet-Karte füllt einfach alles */
#map {
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
  <div id="map-container">
  <div id="map"></div>
</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([50.34, 6.94], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        minZoom: 10,
        attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);


    const marker = L.marker([50.34, 6.94], {
      icon: L.divIcon({
        className: '',
        html: '<div class="car-icon" id="car-marker"></div>',
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      })
    }).addTo(map);

    // Affine Transformation mit 3 Referenzpunkten berechnet
    
    function gameToLatLng(x, y) {
        const lng = 0.000014031 * x + 0.0000003504 * y + 6.937562;
        const lat = 0.0000002519 * x - 0.0000089627 * y + 50.328083;

        return [lat, lng];
        }

function getZoomForSpeed(speedKmh) {
  const minZoom = 15; // bei 150 km/h oder mehr
  const maxZoom = 19; // bei 50 km/h oder weniger

  if (speedKmh <= 50) return maxZoom;
  if (speedKmh >= 150) return minZoom;

  // Interpolation dazwischen
  const factor = (speedKmh - 50) / (150 - 50); // 0 bis 1
  const zoom = maxZoom - factor * (maxZoom - minZoom);

  return Math.round(zoom * 10) / 10; // optional: auf 0.1 runden
}




    // Kontrollierter Intervall (nicht setInterval, sondern rekursives Timeout)
    let fetchInProgress = false;

    function fetchGameData() {
      if (fetchInProgress) return;
      fetchInProgress = true;

      fetch('http://localhost:5000/proxy')
        .then(res => res.json())
        .then(data => {
          const d = data.NewData.FeedbackData;
          const [lat, lng] = gameToLatLng(d.CoordinatesX, d.CoordinatesY);
          const yaw = d.OrientationYaw;

          const speed = data.NewData.FilteredSpeedKmh;
          console.log("Speed:", speed, "Lat:", lat, "Lng:", lng, "Yaw:", yaw);
          
          const zoom = getZoomForSpeed(speed);

          marker.setLatLng([lat, lng]);
          
            map.flyTo([lat, lng], zoom, {
            animate: true,
            duration: 0.25
            });
          const iconDiv = document.getElementById('car-marker');
          if (iconDiv) {
            iconDiv.style.transform = `rotate(${yaw}deg)`;
          }
        
document.getElementById('map-container').style.transform = `translate(-50%, -50%) rotate(${-yaw}deg)`;

        })
        .catch(err => console.error('API-Fehler:', err))
        .finally(() => {
          fetchInProgress = false;
          setTimeout(fetchGameData, 250);
        });
    }

    // Start
    fetchGameData();
  </script>
</body>
</html>
