<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POI Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/poi_editor.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <span class="navbar-brand">SimHub Live Map</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/helper"><i class="fa-solid fa-map-location-dot"></i> Mapping Helper</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/config-user"><i class="fa-solid fa-gears"></i> Config</a>
                    </li>
                </ul>
            </div>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="fa-solid fa-road"></i> Back to Map</a>
                </li>
            </ul>
        </div>
    </nav>
    <input type="text" id="game" value="{{ game }}" disabled>
    <input type="text" id="trackcode" value="{{ trackcode }}" disabled>
    <div id="map"></div>

    <div id="editor-controls-box">
        <div class="editor-box-header">
            
        </div>
        <div class="nib-entries" >

            <div class="destination-entry" >
                <div class="input-group mb-3">      
                    <input type="text" id="search-input" class="form-control" placeholder="Find Place">
                    <button class="btn btn-secondary" id="search-button" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
            <hr class="entry-separator">
            <div class="destination-entry" >
                <button class="btn btn-success" type="button" id="add-point"><i class="fa-solid fa-plus fa-fw"></i> Add POI</button>
            </div>

            <div class="destination-entry" id="point-properties" style="display: none;">
                <div class="mb-3">
                    <label for="point-name" class="form-label"><b>Name:</b></label>
                    <input type="text" class="form-control" id="point-name">
                </div>
                <div class="mb-3">
                    <label for="point-direction" class="form-label"><b>Icon (direction):</b></label>
                    <select class="form-select" aria-label="point-direction" id="point-direction">
                        <option selected>----</option>
                        <option value="left" data-icon="fa-solid fa-diamond-turn-right fa-flip-horizontal">left</option>
                        <option value="right" data-icon="fa-solid fa-diamond-turn-right">right</option>
                        <option value="landmark" data-icon="fa-solid fa-landmark">landmark</option>
                        <option value="route" data-icon="fa-solid fa-route">route</option>
                        <option value="danger" data-icon="fa-solid fa-road-circle-exclamation">straight</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="form-switch" class="form-label"><b>Visibillity:</b></label>
                    <div class="form-check form-switch">
                        
                        <input class="form-check-input" type="checkbox" id="point-hidden">
                        <label class="form-check-label" for="point-hidden">Hide Marker</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="point-icon" class="form-label"><b>Marker Icon on Map</b></label>
                    <input type="text" class="form-control" id="point-icon">
                    <small class="text-muted">*optional</small>
                </div>
                <div class="mb-0">
                    <button class="btn btn-danger" type="button" id="delete-point"><i class="fa-solid fa-trash-can fa-fw"></i> Delete this POI</button>
                </div>
                
            </div>
            <hr class="entry-separator">
            <div class="destination-entry" >
                <button class="btn btn-success" type="button" id="save-geojson"><i class="fa-solid fa-floppy-disk fa-fw"></i> Save all</button>
            </div>

        </div>
    </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
  <script src="/static/poi_editor.js"></script>
</body>
</html>
