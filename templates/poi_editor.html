<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POI Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="navigation" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/poi_editor.css">
    
</head>
<body>

    {% include 'top_nav.html' %}
    <input type="text" id="game" value="{{ game }}" disabled class="d-none">
    <input type="text" id="trackcode" value="{{ trackcode }}" disabled class="d-none">
    <div id="map"></div>

    <div id="editor-controls-box">
        <div class="editor-box-header">
            
        </div>
        <div class="nib-entries" >

            <div class="destination-entry" >
                <div class="input-group">      
                    <input type="text" id="search-input" class="form-control" placeholder="Find Place" value="{{ display_name }}">
                    <button class="btn btn-secondary" id="search-button" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
            
            <div class="destination-entry mb-3" >
                <button class="btn btn-success" type="button" id="add-point"><i class="fa-solid fa-plus fa-fw"></i> Add new POI</button>
            </div>
            <hr class="entry-separator">

            <div class="destination-entry" id="point-properties" style="display: none;">
                <div class="mb-3">
                    <label for="point-name" class="form-label"><b>Name:</b></label>
                    <input type="text" class="form-control" id="point-name">
                </div>
                <div class="mb-3">
                    <label for="point-direction" class="form-label"><b>Icon (direction):</b></label>
                    <select class="form-select" aria-label="point-direction" id="point-direction">
                        <option value="select" data-icon="arrow_drop_down" selected disabled >SELECT ONE</option>  
                        {% for key, value in directions.items() %}
                            <option value="{{ key }}" data-icon="{{ value }}">{{ key }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="form-switch" class="form-label"><b>Visibillity:</b></label>
                    <div class="form-check form-switch">
                        
                        <input class="form-check-input" type="checkbox" id="point-hidden">
                        <label class="form-check-label" for="point-hidden">Hide Marker</label>
                    </div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" value="pacenote" type="radio" name="type" id="type1" checked>
                    <label class="form-check-label" for="type1">
                        Navigation Cue (Pacenote)
                    </label>
                    </div>
                    <div class="form-check">
                    <input class="form-check-input" value="poi" type="radio" name="type" id="type2">
                    <label class="form-check-label" for="type2">
                        POI Marker (Landmark / Location)
                    </label>
                </div>
                <div class="mb-0 mt-3">
                    <button class="btn btn-sm btn-danger" type="button" id="delete-point"><i class="fa-solid fa-trash-can fa-fw"></i> Delete selected POI</button>
                </div>
                
            </div>
            <hr class="entry-separator">
            <div class="destination-entry mt-3 mb-3" >
                <button class="btn btn-success" type="button" id="save-geojson"><i class="fa-solid fa-floppy-disk fa-fw"></i> Save all</button>
            </div>

        </div>
    </div>
    
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
  <script src="/static/poi_editor.js"></script>
</body>
</html>
