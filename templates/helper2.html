<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapping Helper 2 · Navi for SimHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='helper2.css') }}">
    <link rel="icon" href="{{ url_for('favicon_redirect') }}">
</head>
<body>
    {% include 'top_nav.html' %}
    <main id="helper2" class="container-fluid p-3 p-lg-4"
          data-import-url="{{ url_for('helper2_import') }}"
          data-save-url="{{ url_for('helper2_save') }}"
          data-config-url="{{ url_for('get_config') }}"
          {% if game is not none %}data-recording-url="{{ url_for('helper2_recording', game=game, track=track) }}"
          data-track="{{ track }}"{% endif %}>
        <h1 class="h3 mb-3">Mapping Helper 2</h1>
        <div id="status" class="mb-3" role="status" aria-live="polite" hidden></div>
        <form id="upload" class="mb-3" {% if game is not none %}hidden{% endif %}>
            <label for="recording" class="form-label">SimHub lap recording (.shtl)</label>
            <div class="input-group">
                <input id="recording" type="file" class="form-control" accept=".shtl" required>
                <button type="submit" class="btn btn-primary">Load recording</button>
            </div>
        </form>
        <div id="workspace" hidden>
            <div class="mb-3">
                <h2 id="recording-name" class="h5 mb-1"></h2>
                <div id="recording-details" class="text-body-secondary small"></div>
            </div>
            <div class="editor">
                <aside class="editor-controls">
                    <form id="search" class="mb-3">
                        <label for="query" class="form-label">Find the circuit or a nearby town</label>
                        <div class="input-group">
                            <input id="query" type="search" maxlength="256" class="form-control" required>
                            <button type="submit" class="btn btn-outline-secondary">Search</button>
                        </div>
                        <div id="search-results" class="list-group mt-2"></div>
                    </form>
                    <form id="alignment">
                        <label for="track-name" class="form-label">TrackName</label>
                        <input id="track-name" class="form-control mb-3" readonly>
                        <label for="display-name" class="form-label">Display name</label>
                        <input id="display-name" class="form-control mb-3" maxlength="200" required>
                        <button id="place" type="button" class="btn btn-outline-info w-100 mb-2" aria-pressed="true">
                            Place outline on map
                        </button>
                        <button id="fit" type="button" class="btn btn-outline-secondary w-100" disabled>
                            Fit outline in view
                        </button>
                        <p id="placement-help" class="form-text mb-3"></p>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="scale" class="form-label">Scale (m/unit)</label>
                                <input id="scale" type="number" class="form-control" min="0.0001" max="10000"
                                       step="any" value="1" required>
                            </div>
                            <div class="col-6">
                                <label for="rotation" class="form-label">Rotation (°)</label>
                                <input id="rotation" type="number" class="form-control" min="-360" max="360"
                                       step="any" value="0" required>
                            </div>
                            <div class="col-6">
                                <label for="axis" class="form-label">Coordinate plane</label>
                                <select id="axis" class="form-select">
                                    <option value="xz">X / Z</option>
                                    <option value="xy">X / Y</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label for="yaw" class="form-label">Yaw correction (°)</label>
                                <input id="yaw" type="number" class="form-control" min="-360" max="360"
                                       step="any" value="0" required>
                            </div>
                        </div>
                        <div class="form-check mb-3">
                            <input id="mirror" class="form-check-input" type="checkbox">
                            <label for="mirror" class="form-check-label">Mirror outline</label>
                        </div>
                        <button id="save" type="submit" class="btn btn-success w-100" disabled>Save reference points</button>
                    </form>
                </aside>
                <div id="map" aria-label="Satellite map for aligning the circuit"></div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
    <script src="{{ url_for('static', filename='helper2.js', v=script_version) }}"></script>
</body>
</html>
