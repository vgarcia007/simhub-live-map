<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>SimHub Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Navi" />
  <link rel="manifest" href="/static/favicon/site.webmanifest" />
</head>
<body>

  <!-- Map -->
  <div id="map"></div>


  <div id="nav-info-box">
    <div class="box-header">
        <i class="fa-solid fa-location-dot google-pin"></i>
        <span class="nib-title">Info</span>
        <i class="fa-solid fa-chevron-up ms-auto"></i>
    </div>
    <div class="nib-entries" id="nib-entries">

        <div class="destination-entry">
            <div class="entry-icon"><i class="fa-solid fa-house"></i></div>
            <div class="entry-text">
                <div class="entry-name">Zuhause</div>
                <div class="entry-info">5 min · 2,8 km</div>
            </div>
        </div>
        
        <hr class="entry-separator">
        
        <div class="destination-entry">
            <div class="entry-icon"><i class="fa-regular fa-clock"></i></div>
            <div class="entry-text">
                <div class="entry-name">Breitbrunn 3A</div>
                <div class="entry-info">5 min · 2,8 km</div>
            </div>
        </div>

    </div>


  </div>
  

  <!-- Bottom Toolbar -->
  <div id="bottom-toolbar">
    <i class="fa-solid fa-arrow-left"></i>
    <i class="fa-solid fa-phone"></i>
    <i class="fa-solid fa-headphones"></i>
    <i class="fa-solid fa-gears fa-fw" data-bs-toggle="offcanvas" data-bs-target="#offcanvasBottom" aria-controls="offcanvasBottom"></i>
  </div>

  <!-- Optional: Map Loading Spinner -->
  <div id="no-map" style="display: none;">
    <i class="fa-solid fa-spinner fa-spin fa-4x text-light"></i>
  </div>

  <div class="offcanvas offcanvas-bottom bg-black" tabindex="-1" id="offcanvasBottom" aria-labelledby="offcanvasBottomLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasRightLabel"></h5>
      
      <!-- Corrected Button with Bootstrap 5 utility -->
      <button type="button" class="btn btn-dark ms-auto bg-black border-0" data-bs-dismiss="offcanvas" aria-label="Close">
        <i class="fa-solid fa-square-xmark fa-3x"></i>
      </button>
    </div>
  
    <div class="offcanvas-body">
      <div class="list-group bg-black">
        <a href="/config-user" class="list-group-item list-group-item-action bg-black">
          <i class="fa-solid fa-gears fa-fw"></i> Config
        </a>
        <a href="/helper" class="list-group-item list-group-item-action bg-black">
          <i class="fa-solid fa-map-location-dot fa-fw"></i> Mapping Helper
        </a>
      </div>
    </div>
  </div>
  
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
  <script src="/static/app.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
