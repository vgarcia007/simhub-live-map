<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mapping Helper</title>
        <link rel="stylesheet" href="/static/helper.css">

    </head>
    <body>
        <header>
            <h1>Mapping Helper</h1>
        </header>

        <main>
            <p>This output can help you find the coordinates.</p>
            <p>GameName <input type="text" id="GameName"></input></p>
            <p>TrackCode <input type="text" id="TrackCode"></input></p>
            <p>yaw fix (if rotation on map is wrong) <input type="text" id="yaw" value="0"></input></p>
            
            <p>CoordinatesX: <input type="text" id="CoordinatesX"></input></p>
            <p>CoordinatesY: <input type="text" id="CoordinatesY"></input></p>
            <p>Notes (Description of Point) <input type="text" id="notes"></input>*optional</p>
            <p>Paste GPS here: <input type="text" id="gps"></input></p>
            <p><button id="generate">Add</button></p>
            <pre id="result"></pre>
        </main>

        <footer>
            <small><a href="https://github.com/vgarcia007/simhub-map-leaflet">https://github.com/vgarcia007/simhub-map-leaflet</a></small>
        </footer>

        <script src="/static/helper.js"></script>
    </body>
</html>
