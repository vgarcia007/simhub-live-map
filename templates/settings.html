<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/static/tracks.css">

    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="navigation" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />

</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <span class="navbar-brand">NAVI FOR SIMHUB</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/helper"><i class="fa-solid fa-map-location-dot"></i> Mapping Helper</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/list-tracks"><i class="fa-solid fa-road-circle-exclamation"></i> Tracks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/config-user"><i class="fa-solid fa-gears"></i> Config</a>
                    </li>
                </ul>
            </div>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="btn btn-dark" href="/"><i class="fa-solid fa-road"></i> Back to Map</a>
                </li>
            </ul>
        </div>
    </nav>


    <main class="container mt-0 pt-4 pb-4 track-list">
            
        <div class="text-center mt-5">
            <img src="/static/logo/NFSH_Logo_02_white.png" alt="Navi for SimHub" class="img-fluid mb-3" style="max-width: 200px;">
            <p>Version: 1.0</p>
        </div>
    </main>

    <div class="modal fade" id="EditRefsModal" tabindex="-1" aria-labelledby="EditRefsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="EditRefsModallLabel">Edit reference points</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="alert alert-danger text-center" role="alert">
                YOU NEED TO BE ON THE TRACK YOU WANT TO EDIT THE REFERENCE POINTS FOR!
            </div>
            <div class="modal-footer text-center">
                <a type="button" class="btn btn-success w-100" href="/helper">OK, I’m on the track for which I want to edit the reference.</a>
            </div>
            </div>
        </div>
    </div>

    {% include 'footer.html' %}

    <!-- Bootstrap Alert‐Modal -->
    <div class="modal fade" id="alertModal" tabindex="-1" aria-labelledby="alertModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="alertModalLabel">Hinweis</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="alertModalBody">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
            </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/tracks.js"></script>
</body>

</html>
